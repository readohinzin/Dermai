<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9FA">
<title>DermAI, hors ligne</title>
<style>
  html { background:#FFF9FA; color:#2b2118; font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; text-align:center; }
  main { max-width:420px; }
  img { width:96px; height:96px; border-radius:22px; }
  h1 { font-size:1.4rem; margin:16px 0 8px; }
  p { margin:8px 0; color:#5b4a42; }
  button { font:inherit; font-weight:700; margin-top:16px; min-height:48px; padding:0 24px; border:0; border-radius:12px; background:#552d3a; color:#fff; }
</style>
</head>
<body>
<main>
  <img src="/img/icons/icon-192.png" alt="" width="96" height="96">
  <h1>Vous êtes hors ligne</h1>
  <p>DermAI a besoin d'une connexion pour analyser votre photo et afficher vos résultats.</p>
  <p>Vos résultats déjà affichés ne sont pas perdus. Reconnectez-vous, puis réessayez.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
