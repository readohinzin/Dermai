<!-- SCRIPT COMPLET POUR LA PWA                 -->
<!-- ========================================== -->
<script>
  // 1. ENREGISTREMENT DU SERVICE WORKER
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((registration) => {
          console.log('ServiceWorker PWA enregistré:', registration.scope);
        })
        .catch((error) => {
          console.log('Échec de l\'enregistrement du ServiceWorker:', error);
        });
    });
  }

  // 2. GESTION DU BOUTON D'INSTALLATION (Chrome / Edge / Android)
  let deferredPrompt;
  const installBtn = document.getElementById('pwa-install-btn');

  window.addEventListener('beforeinstallprompt', (e) => {
    // Empêche Chrome d'afficher sa propre mini-bannière par défaut
    e.preventDefault();
    // Sauvegarde l'événement pour le déclencher au clic
    deferredPrompt = e;
    // Affiche notre bouton personnalisé
    if (installBtn) installBtn.style.display = 'flex';
  });

  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      
      // Affiche la vraie popup d'installation
      deferredPrompt.prompt();
      
      // Attend le choix de l'utilisateur
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`L'utilisateur a choisi : ${outcome}`);
      
      // Cache le bouton
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });
  }

  // Cache le bouton si l'application est déjà installée
  window.addEventListener('appinstalled', () => {
    if (installBtn) installBtn.style.display = 'none';
    console.log('PWA installée avec succès !');
  });

  // 3. DÉTECTION IOS (Safari sur iPhone/iPad)
  // Safari ne permet pas les popups d'installation automatiques.
  // On peut afficher un petit message d'aide si besoin.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  
  if (isIOS) {
    console.log("Utilisateur sur iOS : Instructions manuelles requises pour installer l'app.");
    // Optionnel : Tu peux créer un script qui affiche une bulle "Appuyez sur Partager puis 'Sur l'écran d'accueil'"
  }
</script>
